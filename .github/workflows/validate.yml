name: Validate

on:
  push:
    branches: [development, test, main, release]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs

  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No dependencies to install — cli/ is deliberately zero-dependency (see cli/README.md).
      - run: npm test
        working-directory: cli

  # The plugin scripts carry their own tests now (BIND-0243). Without this job they would sit in
  # the repo never running, which is worse than having none: it reads as coverage that is not there.
  plugin-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test claude-code/scripts/*.test.mjs
